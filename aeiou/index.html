<style>
:root{--ink:#493751;--vio:#684886;--vio2:#9270aa;--rose:#e9afc4;--gold:#e7bd67;--cream:#fff9f4;--muted:#806f87;--line:#eadfea;--ok:#327258;--warn:#8a602b;--bad:#a3485c;--shadow:0 18px 50px rgba(76,48,79,.13)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% -4%,#ffe6bb 0,transparent 25%),radial-gradient(circle at 90% 4%,#f3d6e5 0,transparent 24%),linear-gradient(180deg,#fffaf6 0,#f8f0fa 55%,#fff9f5 100%);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;min-height:100vh}.shell{max-width:1020px;margin:auto;padding:14px 14px 112px}.hero{position:relative;overflow:hidden;padding:27px;border-radius:32px;background:linear-gradient(135deg,#563d72 0,#7d5c99 52%,#b27b9c 100%);color:#fff;box-shadow:0 22px 58px rgba(75,45,82,.22)}.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.19);border-radius:999px}.hero:before{width:240px;height:240px;right:-95px;top:-105px}.hero:after{width:145px;height:145px;right:20px;bottom:-82px}.hero small{letter-spacing:.14em;font-weight:850;opacity:.8}.hero h1{font-size:clamp(34px,7vw,50px);line-height:1;margin:8px 0}.hero p{max-width:670px;margin:5px 0;line-height:1.52}.heroIcon{font-size:64px;filter:drop-shadow(0 8px 12px #38223d55)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:13px}.card{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.96);border-radius:25px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}.card h2,.card h3{margin-top:5px}.story{cursor:pointer;transition:.18s transform,.18s box-shadow}.story:active{transform:scale(.985)}.art{font-size:44px}.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#f0e8f5;font-size:12px;font-weight:850}.pill.ok{background:#e8f5ee;color:var(--ok)}.pill.warn{background:#fff1df;color:var(--warn)}.pill.bad{background:#fde9ee;color:var(--bad)}.muted{color:var(--muted);font-size:13px;line-height:1.5}.big{font-size:19px;line-height:1.7}button,input,select{font:inherit}button{border:0;border-radius:16px;min-height:46px;padding:11px 15px;background:linear-gradient(135deg,var(--vio),#7d5795);color:#fff;font-weight:850;box-shadow:0 8px 20px rgba(85,55,100,.12);cursor:pointer}button.secondary{background:#f1e9f5;color:var(--ink);box-shadow:none}button.gold{background:linear-gradient(135deg,#f1d185,#dba857);color:#573e19}button.stop{background:linear-gradient(135deg,#a94c65,#c46c7c)}button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;min-height:49px;border:1px solid #e4d6e7;border-radius:15px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:#a784b8;box-shadow:0 0 0 3px #8b64a21a}.answer{margin-top:10px;padding:14px;border-radius:17px;background:#f3ecf7;line-height:1.55}.garden{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;font-size:24px}.lyrics{white-space:pre-line;font-size:18px;line-height:1.72;padding:15px;border-radius:18px;background:#f7f0f9}.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.nav{position:fixed;z-index:50;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);background:rgba(255,251,248,.93);backdrop-filter:blur(18px);border-top:1px solid #eadde8;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:#806f87;box-shadow:none;font-size:10px;padding:4px 2px;min-height:61px}.nav button.on{color:var(--vio)}.nav b{display:block;font-size:22px}.liveOrb{width:116px;height:116px;margin:8px auto 15px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff 0 8%,#f8d7e7 9% 25%,#9b78b0 50%,#5e4277 78%);box-shadow:0 0 0 10px #8e6aa415,0 18px 38px #5a3a6f3b;position:relative}.liveOrb:after{content:"";position:absolute;inset:-12px;border:2px solid #b28bc2;border-radius:50%;opacity:.45}.liveOrb.listening:after{animation:pulse 1s infinite}.liveOrb.speaking{animation:breathe 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.14);opacity:.08}}@keyframes breathe{50%{transform:scale(1.05)}}.wave{display:flex;justify-content:center;align-items:center;height:42px;gap:5px}.wave i{width:4px;height:12px;background:#fff;border-radius:99px}.liveOrb.listening .wave i,.liveOrb.speaking .wave i{animation:w .8s ease-in-out infinite}.wave i:nth-child(2){animation-delay:-.18s}.wave i:nth-child(3){animation-delay:-.36s}.wave i:nth-child(4){animation-delay:-.54s}.wave i:nth-child(5){animation-delay:-.72s}@keyframes w{50%{height:34px}}.statusBar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.transcript{min-height:102px;max-height:230px;overflow:auto;padding:12px;border-radius:17px;background:#fff;border:1px solid var(--line)}.msg{padding:8px 10px;margin:6px 0;border-radius:13px;background:#f5eef8;line-height:1.45}.msg.user{margin-left:10%;background:#fff1e5}.msg.system{font-size:12px;color:var(--muted);background:transparent}.ptt{width:100%;min-height:58px;font-size:17px;touch-action:none;user-select:none}.privacy{font-size:12px;line-height:1.55;color:var(--muted)}.banner{margin-top:13px;padding:12px 14px;border-radius:17px;background:linear-gradient(135deg,#f3ebf7,#fff5e9);border:1px solid #eadde7}.sr{position:absolute;left:-9999px}.loader{display:inline-block;width:13px;height:13px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.garden{grid-template-columns:repeat(6,1fr)}.nav span{display:none}.hero{padding:22px}.heroIcon{font-size:52px}.shell{padding-bottom:105px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

<body><div id="app"></div>
<script>
const BUILD='aeiou-rc3-market-2026-09-03';
const LIVE_BASE='https://qjvopzschqukitvudgfz.supabase.co/functions/v1/aeiou-live-token';
const STORIES=[
{id:'laterne',title:'Die Laterne, die zurückkam',value:'Ehrlichkeit',age:'5–9',min:6,art:'🏮🌙',body:'Samir findet vor dem Haus eine wunderschöne Laterne. Obwohl er sie gern behalten würde, sucht er ihre Besitzerin. Als die Nachbarin erleichtert lächelt, merkt Samir: Ehrlichkeit macht das Herz leicht.'},
{id:'samen',title:'Mariam und der kleine Samen',value:'Dankbarkeit',age:'4–8',min:5,art:'🌱🌸',body:'Mariam gießt jeden Morgen einen winzigen Samen. Sie freut sich über Wasser, Sonne und Erde. Als die erste Blüte erscheint, versteht sie, dass auch kleine Dinge große Dankbarkeit wecken können.'},
{id:'brot',title:'Das warme Brot von nebenan',value:'Nachbarschaft',age:'5–10',min:6,art:'🥖🏡',body:'Yusuf und Lina bemerken eine neue Familie nebenan. Sie bringen warmes Brot und eine kleine Willkommenskarte. Aus einem freundlichen Anfang entsteht eine neue Freundschaft.'},
{id:'regen',title:'Der Regen, der warten ließ',value:'Sabr',age:'5–9',min:5,art:'🌧️🫶',body:'Amina plant ein Picknick, doch plötzlich regnet es. Statt sich lange zu ärgern, baut die Familie drinnen eine gemütliche Picknickhöhle. Amina entdeckt, dass Geduld Platz für neue Ideen schafft.'},
{id:'dattel',title:'Die letzte Dattel',value:'Teilen',age:'4–8',min:5,art:'🌴✨',body:'Bilal hat nur noch eine Dattel, sein Freund aber keinen Snack. Bilal teilt sie in zwei kleine Hälften. Beide merken: Großzügigkeit hängt nicht davon ab, wie viel man besitzt.'},
{id:'stern',title:'Soraya und der mutige Stern',value:'Verzeihen',age:'5–10',min:6,art:'⭐💗',body:'Nach einem Streit liegt Sorayas Papierstern zerrissen auf dem Tisch. Soraya findet den Mut für den ersten Schritt. Gemeinsam entschuldigen sich die Geschwister und kleben den Stern wieder zusammen.'},
{id:'schuhe',title:'Die leise gute Tat',value:'Gute Absicht',age:'4–8',min:4,art:'👟🌿',body:'Nura stellt im Flur alle Schuhe ordentlich hin, ohne jemandem davon zu erzählen. Niemand klatscht. Trotzdem fühlt sich die gute Tat richtig an.'},
{id:'apfel',title:'Der geteilte Apfel',value:'Großzügigkeit',age:'4–8',min:4,art:'🍎🤲',body:'Omar merkt, dass sein Freund sein Frühstück vergessen hat. Er teilt seinen Apfel. Aus zwei Hälften wird ein Moment echter Freundschaft.'},
{id:'tasse',title:'Das ehrliche Herz',value:'Wahrhaftigkeit',age:'5–9',min:5,art:'☕🌼',body:'Sara stößt aus Versehen eine Tasse um. Erst möchte sie schweigen, dann erzählt sie ehrlich, was passiert ist. Gemeinsam wird alles wieder sauber.'},
{id:'garten',title:'Der Noor-Garten',value:'Gute Gewohnheiten',age:'5–10',min:6,art:'🌺🪴',body:'Jeden Tag pflanzt Ilyas symbolisch eine Blüte für eine gute Tat: helfen, teilen, freundlich sprechen. Bald ist sein Noor-Garten voller kleiner Erinnerungen an das Gute.'},
{id:'bruecke',title:'Die Brücke aus guten Worten',value:'Freundlichkeit',age:'5–10',min:6,art:'🌉💬',body:'Zwei Kinder streiten beim Spielen. Ein freundliches Wort macht den Anfang, ein zweites baut die Brücke. Am Ende spielen beide wieder zusammen.'},
{id:'rucksack',title:'Der leichte Rucksack',value:'Vergebung',age:'6–10',min:6,art:'🎒🕊️',body:'Mina stellt sich vor, Ärger wäre ein schwerer Stein im Rucksack. Als sie verzeiht, fühlt sich der Rucksack leichter an. Sie lernt: Loslassen kann Mut brauchen.'},
{id:'wasser',title:'Ein Becher Wasser',value:'Hilfsbereitschaft',age:'4–8',min:4,art:'💧🌷',body:'Amir sieht, dass sein Großvater durstig ist. Er bringt ihm einen Becher Wasser, noch bevor jemand darum bittet. Kleine Aufmerksamkeit kann sehr viel bedeuten.'},
{id:'mond',title:'Der Mond am Fenster',value:'Ruhe',age:'4–8',min:5,art:'🌙🛏️',body:'Vor dem Schlafen ist Lina noch aufgeregt. Sie schaut auf den Mond, atmet langsam und denkt an drei schöne Dinge des Tages. Ihr Herz wird ruhig.'},
{id:'karte',title:'Die Karte für Oma',value:'Familie',age:'4–9',min:4,art:'💌🌸',body:'Die Kinder basteln eine Karte für ihre Oma. Jede Blume steht für etwas, das sie an ihr lieben. Die Karte wird zu einem kleinen Familien-Schatz.'},
{id:'spielplatz',title:'Ein Platz für alle',value:'Respekt',age:'5–10',min:5,art:'🛝🤝',body:'Auf dem Spielplatz ist ein neues Kind sehr still. Mariam macht Platz und lädt es freundlich ein. Bald wird aus Unsicherheit gemeinsames Lachen.'},
{id:'fehler',title:'Der schiefe Turm',value:'Mut zum Lernen',age:'5–9',min:5,art:'🧱✨',body:'Yusuf baut einen Turm, der immer wieder umfällt. Statt aufzugeben, probiert er ruhig weiter. Am Ende steht nicht der höchste, sondern sein bester Turm.'},
{id:'familie',title:'Das Licht im Wohnzimmer',value:'Familienliebe',age:'4–9',min:5,art:'🏠💛',body:'Als der Strom kurz ausfällt, sitzt die Familie zusammen bei einer kleinen Lampe. Sie erzählen Geschichten und lachen. Die Kinder merken: Wärme kommt nicht nur aus einer Steckdose.'}
];
const SONGS=[
{title:'Kleine Herzen',theme:'Gute Taten',lyrics:'Kleine Herzen, helles Licht,\nfreundlich sein vergisst man nicht.\nSchritt für Schritt und Tag für Tag,\ngutes tun, so gut ich mag.'},
{title:'Alhamdulillah-Tag',theme:'Dankbarkeit',lyrics:'Morgens Sonne, abends Stern,\nDanke sagen hab ich gern.\nFür ein Lachen, Brot und Spiel,\nAlhamdulillah – danke für so viel.'},
{title:'Sabr-Song',theme:'Geduld',lyrics:'Langsam wächst der kleine Baum,\nheute klein und morgen kaum.\nIch bleib ruhig, Schritt für Schritt,\nSabr nimmt mein Herzchen mit.'},
{title:'Teilen macht hell',theme:'Großzügigkeit',lyrics:'Eine Hälfte für dich, eine für mich,\nteilen macht das Herz ganz licht.\nEine Hand hilft, eine Hand gibt,\nschön ist, wer das Gute liebt.'},
{title:'Leise wird die Nacht',theme:'Schlaf',lyrics:'Leise wird die Nacht nun hier,\nRuhe wohnt jetzt nah bei mir.\nMit Bismillah schlaf ich ein,\nmorgen darf ein neuer Tag sein.'},
{title:'Ein gutes Wort',theme:'Freundlichkeit',lyrics:'Ein gutes Wort, ein kleines Licht,\nein Lächeln, das die Sorge bricht.\nIch helfe dir, du hilfst mir,\nFreundlichkeit beginnt schon hier.'},
{title:'Unser warmes Zuhause',theme:'Familie',lyrics:'Hand in Hand und Herz an Herz,\nwir teilen Freude, tragen Schmerz.\nMit Liebe wächst in unserm Haus,\nein warmes Licht von innen raus.'},
{title:'Noor-Garten',theme:'Gute Gewohnheiten',lyrics:'Eine Blüte für ein gutes Wort,\neine für Hilfe hier und dort.\nJeden Tag ein kleines Licht,\nmein Noor-Garten vergisst es nicht.'}
];
const LEARN=[['Bismillah','Ein bewusster guter Start: Viele muslimische Familien sagen Bismillah vor alltäglichen guten Dingen.','🌙'],['Alhamdulillah','Ein Ausdruck von Dankbarkeit gegenüber Allah. Nenne heute drei Dinge, für die du dankbar bist.','🌼'],['Sabr','Geduldig beim Guten bleiben, auch wenn etwas Zeit braucht oder schwierig ist.','🌱'],['Sadaqah','Freiwillige Wohltätigkeit kann Geld, Hilfe, Zeit, Teilen oder ein freundliches Wort sein.','🤲'],['Salam','Ein freundlicher Friedensgruß, mit dem Menschen einander Respekt und Nähe zeigen.','🕊️'],['Adab','Gutes Benehmen: freundlich sprechen, zuhören, respektvoll sein und andere gut behandeln.','✨']];
const SAFE='Darüber bin ich nicht sicher genug. Frag bitte gemeinsam mit einem Elternteil eine vertrauenswürdige Lehrkraft. Wir können gern über eine Geschichte, Freundlichkeit oder Dankbarkeit sprechen.';
const DEFAULTS={voice:true,mic:false,chant:true,live:false};
let S={view:'home',story:null,song:0,q:'',ans:'Assalamu alaikum! Ich bin Amina. Du kannst mit mir Geschichten entdecken, lernen oder – nach Elternfreigabe – live sprechen.',settings:load('aeiou.rc3.settings',DEFAULTS),prog:load('aeiou.rc3.progress',{done:[],fav:[]}),parent:false,parentSession:'',challenge:null,liveHealth:null,live:'offline',transcript:[],ws:null,stream:null,audioCtx:null,source:null,processor:null,playAt:0};
const A=document.getElementById('app');
function load(k,d){try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)||'{}'))}catch{return Object.assign({},d)}}
function save(){localStorage.setItem('aeiou.rc3.settings',JSON.stringify(S.settings));localStorage.setItem('aeiou.rc3.progress',JSON.stringify(S.prog))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function hero(t,p,e){return `<section class="hero"><div class="row between"><div><small>AEIOU · AMINA RC3</small><h1>${esc(t)}</h1><p>${esc(p)}</p></div><div class="heroIcon">${e}</div></div></section>`}
function nav(){const n=[['home','🏠','Start'],['stories','📚','Stories'],['learn','✨','Lernen'],['songs','🎵','Singen'],['amina','🎙️','Amina'],['sleep','🌙','Schlaf'],['parents','🔒','Eltern']];return `<nav class="nav">${n.map(x=>`<button data-nav="${x[0]}" class="${S.view===x[0]?'on':''}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</nav>`}
function tile(s){return `<article class="card story" data-story="${s.id}"><div class="art">${s.art}</div><h3>${esc(s.title)}</h3><span class="pill">${esc(s.value)}</span><p class="muted">${s.age} · ${s.min} Min.</p></article>`}
function home(){const flowers=Math.min(30,S.prog.done.length);return `<main class="shell">${hero('AEIOU','Eine ruhige, werbefreie islamische Kinderwelt mit Amina, Geschichten, Lernen, Musik und Abendbegleitung.','🌙📖')}<div class="grid"><div class="card"><h2>🌺 Noor-Garten</h2><div class="garden">${Array.from({length:30},(_,i)=>i<flowers?'🌸':'·').join('')}</div><p class="muted">Kein Streak-Druck. Eine abgeschlossene Geschichte pflanzt nur eine kleine Blüte.</p></div><div class="card"><h2>🛡️ Kindersicher</h2><p class="muted">Keine Werbung · kein Tracking · kein Standort · kein Kinderkonto · keine Speicherung von Roh-Audio. Mikrofon und Gemini Live sind standardmäßig aus.</p><span class="pill ok">PIGA · Capability ≠ Permission</span></div></div><div class="banner"><b>✨ Neu in RC3:</b> Amina Live ist technisch integriert. Live-Audio wird nur nach Elternfreigabe gestartet und nutzt kurzlebige Einmal-Tokens; bei fehlender Cloud-Konfiguration bleibt Amina sicher lokal.</div><div class="grid">${STORIES.slice(0,4).map(tile).join('')}</div></main>${nav()}`}
function stories(){return `<main class="shell">${hero('Noor Stories','18 originale Geschichten über gute Werte – ruhig, kurz und ohne offenen Webzugriff.','📚✨')}<div class="grid">${STORIES.map(tile).join('')}</div></main>${nav()}`}
function reader(){const s=S.story||STORIES[0],done=S.prog.done.includes(s.id),fav=S.prog.fav.includes(s.id);return `<main class="shell">${hero(s.title,s.value,s.art)}<div class="card"><p class="big">${esc(s.body)}</p><div class="row"><button data-speak="${esc(s.body)}">🔊 Vorlesen</button><button class="secondary" data-fav>${fav?'♥':'♡'} Favorit</button><button class="gold" data-finish>${done?'✓ Im Noor-Garten':'🌸 Abschließen'}</button></div></div><button class="secondary" data-nav="stories">← Zur Bibliothek</button></main>${nav()}`}
function learn(){return `<main class="shell">${hero('Entdecken','Kleine Lernkarten für Begriffe und gute Gewohnheiten.','🌱✨')}<div class="grid">${LEARN.map(x=>`<div class="card"><div class="art">${x[2]}</div><h2>${esc(x[0])}</h2><p>${esc(x[1])}</p><button class="secondary" data-speak="${esc(x[0]+'. '+x[1])}">🔊 Anhören</button></div>`).join('')}</div></main>${nav()}`}
function songs(){const s=SONGS[S.song];return `<main class="shell">${hero('Singmodus','8 originale Lernlieder. Lokale Melodie und Sprach-Chant – transparent, ohne falsche Premium-Stimmbehauptung.','🎵🌸')}<div class="card"><select id="song">${SONGS.map((x,i)=>`<option value="${i}" ${i===S.song?'selected':''}>${esc(x.title)} · ${esc(x.theme)}</option>`).join('')}</select><div class="lyrics">${esc(s.lyrics)}</div><div class="row"><button class="gold" data-sing>▶ Melodie + Chant</button><button class="secondary" data-speak="${esc(s.lyrics)}">🔊 Nur Stimme</button></div></div></main>${nav()}`}
function liveBadge(){if(S.live==='ready')return '<span class="pill ok">● Gemini Live bereit</span>';if(S.live==='listening')return '<span class="pill ok">● Amina hört zu</span>';if(S.live==='speaking')return '<span class="pill ok">● Amina spricht</span>';if(S.live==='connecting')return '<span class="pill warn">● Verbindung…</span>';if(S.live==='not-configured')return '<span class="pill warn">● Live vorbereitet · Server-Key fehlt</span>';if(S.live==='blocked')return '<span class="pill bad">● Elternfreigabe erforderlich</span>';return '<span class="pill">● Sicherer lokaler Modus</span>'}
function transcriptHtml(){return S.transcript.length?S.transcript.slice(-10).map(m=>`<div class="msg ${m.role}"><b>${m.role==='user'?'Du':m.role==='amina'?'Amina':'System'}:</b> ${esc(m.text)}</div>`).join(''):'<div class="msg system">Noch kein Live-Gespräch. Es wird kein Roh-Audio gespeichert.</div>'}
function amina(){return `<main class="shell">${hero('Amina','Eine freundliche Kinder-KI mit sicherem Offline-Fallback und optionalem Gemini-Live-Audio nach Elternfreigabe.','🎙️🌙')}<div class="grid"><div class="card"><div id="orb" class="liveOrb ${S.live==='listening'?'listening':S.live==='speaking'?'speaking':''}"><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div><div class="statusBar">${liveBadge()}<span class="pill">Inference only</span><span class="pill">A7SEM Reverse</span></div><div class="transcript" id="transcript">${transcriptHtml()}</div><input id="q" maxlength="240" placeholder="Amina etwas fragen …" value="${esc(S.q)}"><div class="row" style="margin-top:10px"><button data-ask>Antwort</button><button class="secondary" data-live-connect>${S.live==='ready'?'Live verbunden':'Amina Live starten'}</button><button class="stop" data-stop>Stop</button></div>${S.live==='ready'?'<button class="ptt gold" data-ptt style="margin-top:10px">🎙️ Gedrückt halten zum Sprechen</button>':''}<p class="privacy">Live nutzt Push-to-Talk statt Always-on-Mikrofon. Audio wird nur während gedrückter Taste übertragen. Keine Roh-Audio-Speicherung durch AEIOU; keine Außenaktionen; keine offenen Links.</p></div><div class="card"><h2>💬 Sichere Text-Amina</h2><div class="answer">${esc(S.ans)}</div><p class="muted">Textfragen funktionieren immer lokal. Gemini Live ist eine optionale Elternfreigabe und darf nichts kaufen, senden, veröffentlichen oder außerhalb von AEIOU ausführen.</p><button class="secondary" data-speak="${esc(S.ans)}">🔊 Antwort vorlesen</button></div></div></main>${nav()}`}
function sleep(){return `<main class="shell">${hero('Schlafmodus','Eine langsame Abendroutine ohne Druck, Punkte oder Hintergrundaktivität.','🌙🛏️')}<div class="card"><h2>Leise wird die Nacht</h2><p class="big">Leg das Gerät bequem hin. Atme langsam ein und aus. Denk an drei schöne Dinge von heute. Mit Bismillah darf der Tag nun ruhig enden.</p><div class="row"><button data-speak="Leg das Gerät bequem hin. Atme langsam ein und aus. Denk an drei schöne Dinge von heute. Mit Bismillah darf der Tag nun ruhig enden.">🔊 Ruhig vorlesen</button><button class="secondary" data-speak="Leise wird die Nacht nun hier. Ruhe wohnt jetzt nah bei mir. Mit Bismillah schlaf ich ein. Morgen darf ein neuer Tag sein.">🎵 Schlaflied</button></div></div></main>${nav()}`}
function parents(){if(!S.parent)return `<main class="shell">${hero('Elternbereich','Erwachsenen-Schranke für Mikrofon und Amina Live.','🔒')}<div class="card"><h2>Elternfreigabe</h2><p>Für Live-Audio ist eine kurze Erwachsenenprüfung erforderlich.</p><button data-challenge>Neue Aufgabe laden</button>${S.challenge?`<div class="banner"><b>${esc(S.challenge.question)}</b><input id="gate" inputmode="numeric" placeholder="Ergebnis" style="margin-top:8px"><button data-unlock style="margin-top:8px">Freigeben</button></div>`:''}<p class="privacy">Diese Web-Preview nutzt eine kurzlebige Erwachsenen-Schranke. Der kanonische App-Pfad kann zusätzlich Clerk-Elternauthentifizierung verwenden.</p></div></main>${nav()}`;return `<main class="shell">${hero('Elternbereich','Freigaben, Live-Status und Glassbox.','🔒🌿')}<div class="grid"><div class="card"><h2>Freigaben</h2>${[['voice','Vorlesen'],['mic','Mikrofon / Push-to-Talk'],['live','Gemini Live']].map(x=>`<div class="setting"><b>${x[1]}</b><button class="secondary" data-toggle="${x[0]}">${S.settings[x[0]]?'AN':'AUS'}</button></div>`).join('')}<p class="muted">Gemini Live kann nur funktionieren, wenn Mikrofon + Live freigegeben und der serverseitige Gemini-Key konfiguriert sind.</p></div><div class="card"><h2>Live Readiness</h2><div class="statusBar">${liveBadge()}<span class="pill ${S.liveHealth?.keyConfigured?'ok':'warn'}">Server-Key ${S.liveHealth?.keyConfigured?'vorhanden':'fehlt'}</span></div><p class="privacy">Authentifizierung: kurzlebiger Parent-Session-Token → serverseitig geminteter Gemini-Einmal-Token → eingeschränkte Live-Sitzung. Der dauerhafte API-Key gehört niemals in den Browser.</p><button class="secondary" data-health>Neu prüfen</button></div></div><div class="card"><h2>Glassbox</h2><p class="privacy">Keine Werbung · kein Tracking · kein Standort · kein Kinderkonto · keine Speicherung von Roh-Audio durch AEIOU · Push-to-Talk · Capability ≠ Permission · Inference ≠ Action · UNKNOWN bleibt UNKNOWN · A7SEM Reverse nach relevanten Entscheidungen.</p><button class="secondary" data-reset>Lokalen Fortschritt löschen</button></div></main>${nav()}`}
function localAnswer(q){const s=q.toLowerCase();if(/adresse|schule|telefon|handy|foto|email|standort|passwort|treffen|url|link|geheimnis/.test(s))return 'Über private Daten sprechen wir hier nicht. Frag bitte deine Eltern. Wollen wir über eine Geschichte oder eine gute Tat reden?';if(/sabr|geduld/.test(s))return 'Sabr bedeutet, geduldig beim Guten zu bleiben, auch wenn etwas Zeit braucht. Stell dir einen Samen vor: Du gießt ihn weiter, obwohl die Blüte noch nicht da ist.';if(/dank|alhamdulillah/.test(s))return 'Dankbarkeit kann klein beginnen. Nenne drei Dinge, die heute schön waren – vielleicht ein Lachen, Wasser oder ein gemütlicher Moment.';if(/geschichte|erzähl/.test(s))return STORIES[Math.floor(Math.random()*STORIES.length)].body;if(/teilen|sadaqah/.test(s))return 'Teilen muss nicht groß sein. Zeit, Hilfe, ein freundliches Wort oder etwas von deinem Snack können schon wertvoll sein.';if(/halal|haram|fatwa|sünde|verboten|erlaubt|qur|koran|hadith/.test(s))return 'Bei genauen religiösen Regeln oder Quellen möchte ich nichts erfinden. Frag bitte gemeinsam mit einem Elternteil eine vertrauenswürdige Lehrkraft oder Gelehrte. Danach helfe ich dir gern beim kindgerechten Verstehen.';return SAFE}
function speak(t,r=.92){if(!S.settings.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=r;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^de/i.test(v.lang)&&/female|anna|katja|helena|petra|vicki|victoria|google.*deutsch/i.test((v.name||'')+' '+(v.voiceURI||'')))||vs.find(v=>/^de/i.test(v.lang))||null;speechSynthesis.speak(u)}
function sing(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){speak(SONGS[S.song].lyrics,.82);return}const c=new AC(),g=c.createGain();g.gain.value=.07;g.connect(c.destination);let now=c.currentTime+.05;const notes=[261.6,293.7,329.6,392,440,392,329.6,293.7];SONGS[S.song].lyrics.split(/\s+/).forEach((_,i)=>{const o=c.createOscillator(),v=c.createGain();o.type='triangle';o.frequency.value=notes[i%notes.length];v.gain.setValueAtTime(.001,now);v.gain.exponentialRampToValueAtTime(.45,now+.02);v.gain.exponentialRampToValueAtTime(.001,now+.22);o.connect(v).connect(g);o.start(now);o.stop(now+.25);now+=.23});if(S.settings.chant)speak(SONGS[S.song].lyrics,.82);setTimeout(()=>c.close().catch(()=>{}),Math.max(500,(now-c.currentTime)*1000+200))}
async function health(){try{const r=await fetch(LIVE_BASE+'/health',{cache:'no-store'}),d=await r.json();S.liveHealth=d;if(!d.keyConfigured&&S.live!=='ready')S.live='not-configured';return d}catch{S.liveHealth=null;return null}}
async function challenge(){try{const r=await fetch(LIVE_BASE+'/challenge',{cache:'no-store'}),d=await r.json();if(d.ok){S.challenge=d;render()}}catch{alert('Elternprüfung momentan nicht erreichbar.')}}
async function unlock(){const ans=Number(document.getElementById('gate')?.value),d=S.challenge;if(!d)return;try{const r=await fetch(LIVE_BASE+'/parent-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({challenge:d.challenge,answer:ans})}),x=await r.json();if(!r.ok||!x.ok){alert('Bitte Aufgabe noch einmal prüfen.');return}S.parent=true;S.parentSession=x.parentSession;S.challenge=null;await health();render()}catch{alert('Elternfreigabe momentan nicht erreichbar.')}}
function base64ToBytes(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function bytesToBase64(bytes){let s='';const a=new Uint8Array(bytes);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)}
function floatToPCM16(input){const out=new Int16Array(input.length);for(let i=0;i<input.length;i++){const s=Math.max(-1,Math.min(1,input[i]));out[i]=s<0?s*0x8000:s*0x7fff}return out}
function resample(input,inRate,outRate=16000){if(inRate===outRate)return input;const ratio=inRate/outRate,len=Math.round(input.length/ratio),out=new Float32Array(len);for(let i=0;i<len;i++){const pos=i*ratio,lo=Math.floor(pos),hi=Math.min(input.length-1,lo+1),f=pos-lo;out[i]=input[lo]*(1-f)+input[hi]*f}return out}
async function playPCM(base64){try{const bytes=base64ToBytes(base64),view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),n=Math.floor(bytes.byteLength/2),floats=new Float32Array(n);for(let i=0;i<n;i++)floats[i]=view.getInt16(i*2,true)/32768;S.audioCtx=S.audioCtx||new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});const buf=S.audioCtx.createBuffer(1,n,24000);buf.copyToChannel(floats,0);const src=S.audioCtx.createBufferSource();src.buffer=buf;src.connect(S.audioCtx.destination);S.playAt=Math.max(S.playAt||0,S.audioCtx.currentTime+.02);src.start(S.playAt);S.playAt+=buf.duration;S.live='speaking';renderSoft()}catch{}}
function renderSoft(){const orb=document.getElementById('orb');if(orb)orb.className='liveOrb '+(S.live==='listening'?'listening':S.live==='speaking'?'speaking':'');const t=document.getElementById('transcript');if(t){t.innerHTML=transcriptHtml();t.scrollTop=t.scrollHeight}}
function addMsg(role,text){text=String(text||'').trim();if(!text)return;const last=S.transcript[S.transcript.length-1];if(last&&last.role===role&&last.text===text)return;S.transcript.push({role,text});renderSoft()}
function handleLiveMessage(ev){let m;try{m=JSON.parse(ev.data)}catch{return}if(m.setupComplete){S.live='ready';addMsg('system','Amina Live ist bereit.')}const c=m.serverContent;if(c?.inputTranscription?.text)addMsg('user',c.inputTranscription.text);if(c?.outputTranscription?.text)addMsg('amina',c.outputTranscription.text);const parts=c?.modelTurn?.parts||[];for(const p of parts){if(p.inlineData?.data&&String(p.inlineData?.mimeType||'').startsWith('audio/'))playPCM(p.inlineData.data);if(p.text)addMsg('amina',p.text)}if(c?.turnComplete){S.live='ready';renderSoft()}}
async function connectLive(){if(!S.parent){S.live='blocked';S.view='parents';render();return}if(!S.settings.live||!S.settings.mic){alert('Bitte im Elternbereich zuerst Mikrofon und Gemini Live freigeben.');return}S.live='connecting';render();try{const r=await fetch(LIVE_BASE+'/token',{method:'POST',headers:{'content-type':'application/json','x-aeiou-parent-session':S.parentSession},body:'{}'}),d=await r.json();if(!r.ok||!d.ok){S.live=d.error==='GEMINI_NOT_CONFIGURED'?'not-configured':'offline';S.view='amina';render();return}const url='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token='+encodeURIComponent(d.token);const ws=new WebSocket(url);S.ws=ws;ws.onopen=()=>{ws.send(JSON.stringify({setup:{model:'models/gemini-3.1-flash-live-preview',generationConfig:{responseModalities:['AUDIO']},speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Aoede'}}},inputAudioTranscription:{},outputAudioTranscription:{},realtimeInputConfig:{automaticActivityDetection:{disabled:true}}}}))};ws.onmessage=handleLiveMessage;ws.onerror=()=>{S.live='offline';addMsg('system','Live-Verbindung wurde sicher beendet. Lokale Amina bleibt verfügbar.')};ws.onclose=()=>{stopMic();S.live='offline';renderSoft()}}catch{S.live='offline';render()}}
async function startMic(){if(!S.ws||S.ws.readyState!==1||S.live==='listening')return;try{S.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});const AC=window.AudioContext||window.webkitAudioContext;S.audioCtx=S.audioCtx||new AC();const ctx=new AC();S.source=ctx.createMediaStreamSource(S.stream);S.processor=ctx.createScriptProcessor(2048,1,1);S.source.connect(S.processor);S.processor.connect(ctx.destination);S.ws.send(JSON.stringify({realtimeInput:{activityStart:{}}}));S.processor.onaudioprocess=e=>{if(!S.ws||S.ws.readyState!==1)return;const raw=e.inputBuffer.getChannelData(0),res=resample(raw,ctx.sampleRate,16000),pcm=floatToPCM16(res);S.ws.send(JSON.stringify({realtimeInput:{audio:{data:bytesToBase64(pcm.buffer),mimeType:'audio/pcm;rate=16000'}}}))};S.live='listening';renderSoft()}catch{S.live='offline';alert('Mikrofon konnte nicht gestartet werden.')}}
function stopMic(){try{if(S.ws&&S.ws.readyState===1&&S.live==='listening')S.ws.send(JSON.stringify({realtimeInput:{activityEnd:{}}}))}catch{}try{S.processor?.disconnect();S.source?.disconnect();S.stream?.getTracks().forEach(t=>t.stop())}catch{}S.processor=S.source=S.stream=null;if(S.ws&&S.ws.readyState===1)S.live='ready';renderSoft()}
function stopLive(){stopMic();try{S.ws?.close()}catch{}S.ws=null;try{speechSynthesis?.cancel()}catch{}S.live=S.liveHealth?.keyConfigured?'offline':'not-configured';render()}
function render(){A.innerHTML=S.view==='home'?home():S.view==='stories'?stories():S.view==='reader'?reader():S.view==='learn'?learn():S.view==='songs'?songs():S.view==='amina'?amina():S.view==='sleep'?sleep():parents();bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{if(S.view==='amina'&&e.dataset.nav!=='amina')stopMic();S.view=e.dataset.nav;render()});document.querySelectorAll('[data-story]').forEach(e=>e.onclick=()=>{S.story=STORIES.find(x=>x.id===e.dataset.story)||STORIES[0];S.view='reader';render()});document.querySelectorAll('[data-speak]').forEach(e=>e.onclick=()=>speak(e.dataset.speak));let x=document.querySelector('[data-finish]');if(x)x.onclick=()=>{const id=S.story.id;if(!S.prog.done.includes(id))S.prog.done.push(id);save();render()};x=document.querySelector('[data-fav]');if(x)x.onclick=()=>{const id=S.story.id;S.prog.fav=S.prog.fav.includes(id)?S.prog.fav.filter(y=>y!==id):[...S.prog.fav,id];save();render()};x=document.getElementById('song');if(x)x.onchange=()=>{S.song=Number(x.value);render()};x=document.querySelector('[data-sing]');if(x)x.onclick=sing;x=document.querySelector('[data-ask]');if(x)x.onclick=()=>{S.q=(document.getElementById('q')?.value||'').trim();if(S.q){S.ans=localAnswer(S.q);S.transcript.push({role:'user',text:S.q},{role:'amina',text:S.ans});speak(S.ans)}render()};x=document.querySelector('[data-challenge]');if(x)x.onclick=challenge;x=document.querySelector('[data-unlock]');if(x)x.onclick=unlock;document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{S.settings[e.dataset.toggle]=!S.settings[e.dataset.toggle];save();render()});x=document.querySelector('[data-health]');if(x)x.onclick=async()=>{await health();render()};x=document.querySelector('[data-live-connect]');if(x)x.onclick=connectLive;x=document.querySelector('[data-stop]');if(x)x.onclick=stopLive;x=document.querySelector('[data-reset]');if(x)x.onclick=()=>{if(confirm('Lokalen Fortschritt wirklich löschen?')){S.prog={done:[],fav:[]};save();render()}};const p=document.querySelector('[data-ptt]');if(p){const start=e=>{e.preventDefault();startMic()};const end=e=>{e.preventDefault();stopMic()};p.addEventListener('pointerdown',start);p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);p.addEventListener('pointerleave',e=>{if(e.buttons)end(e)})}}
health().finally(()=>render());
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
