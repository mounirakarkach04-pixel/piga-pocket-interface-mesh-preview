<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#72538f"><link rel="manifest" href="./manifest.webmanifest"><title>AEIOU – Amina RC2</title><style>
:root{--ink:#4b3959;--vio:#72538f;--rose:#f4c5d2;--gold:#f4cf7b;--bg:#fff8f5;--card:#fff;--muted:#806f87}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fff0d1,transparent 28%),linear-gradient(180deg,#fff8f5,#f7eff9);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:920px;margin:auto;padding:14px 14px 108px}.hero{padding:24px;border-radius:30px;background:linear-gradient(145deg,#5e477b,#9a78b2 62%,#c68ea9);color:#fff;box-shadow:0 18px 48px #5d406126}.hero h1{margin:4px 0;font-size:38px}.hero p{margin:5px 0;line-height:1.5}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.card{background:#ffffffed;border:1px solid #fff;border-radius:24px;padding:16px;box-shadow:0 14px 34px #684e6c18}.story{cursor:pointer}.art{font-size:42px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#f0e7f6;font-size:12px;font-weight:800}button,input,select{font:inherit}button{border:0;border-radius:15px;min-height:44px;padding:10px 14px;background:var(--vio);color:#fff;font-weight:800}button.secondary{background:#f0e7f6;color:var(--ink)}button.gold{background:linear-gradient(135deg,#f6d98c,#e9ad64);color:#5a411b}input,select{width:100%;min-height:48px;border:1px solid #e4d7e7;border-radius:14px;padding:10px;background:#fff;color:var(--ink)}.answer{margin-top:10px;padding:13px;border-radius:14px;background:#f3ecf8;line-height:1.5}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);background:#fffaf8f2;backdrop-filter:blur(14px);border-top:1px solid #eadde8;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}.nav button{background:transparent;color:#7a697f;font-size:10px;padding:4px 2px;min-height:58px}.nav .on{color:var(--vio)}.nav b{display:block;font-size:21px}.storybody{font-size:19px;line-height:1.65}.garden{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:28px}.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee4ed}.safe{background:#eaf6ef;color:#2e6c4f}.warn{background:#fff1df;color:#8b5c24}.lyrics{white-space:pre-line;font-size:18px;line-height:1.7;padding:14px;border-radius:18px;background:#f6eff9}@media(max-width:620px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.nav span{display:none}.garden{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div id="app"></div><script>
const BUILD="aeiou-rc2-live-2026-09-03",STORIES=[{"id":"laterne","title":"Die Laterne, die zurückkam","value":"Ehrlichkeit","age":"5–9","min":6,"art":"🏮🌙","body":"Samir findet vor dem Haus eine wunderschöne Laterne. Obwohl er sie gern behalten würde, sucht er ihre Besitzerin. Als die Nachbarin erleichtert lächelt, merkt Samir: Ehrlichkeit macht das Herz leicht."},{"id":"samen","title":"Mariam und der kleine Samen","value":"Dankbarkeit","age":"4–8","min":5,"art":"🌱🌸","body":"Mariam gießt jeden Morgen einen winzigen Samen. Sie freut sich über Wasser, Sonne und Erde. Als die erste Blüte erscheint, versteht sie, dass auch kleine Dinge große Dankbarkeit wecken können."},{"id":"brot","title":"Das warme Brot von nebenan","value":"Nachbarschaft","age":"5–10","min":6,"art":"🥖🏡","body":"Yusuf und Lina bemerken eine neue Familie nebenan. Sie bringen warmes Brot und eine kleine Willkommenskarte. Aus einem freundlichen Anfang entsteht eine neue Freundschaft."},{"id":"regen","title":"Der Regen, der warten ließ","value":"Sabr","age":"5–9","min":5,"art":"🌧️🫶","body":"Amina plant ein Picknick, doch plötzlich regnet es. Statt sich lange zu ärgern, baut die Familie drinnen eine gemütliche Picknickhöhle. Amina entdeckt, dass Geduld Platz für neue Ideen schafft."},{"id":"dattel","title":"Die letzte Dattel","value":"Teilen","age":"4–8","min":5,"art":"🌴✨","body":"Bilal hat nur noch eine Dattel, sein Freund aber keinen Snack. Bilal teilt sie in zwei kleine Hälften. Beide merken: Großzügigkeit hängt nicht davon ab, wie viel man besitzt."},{"id":"stern","title":"Soraya und der mutige Stern","value":"Verzeihen","age":"5–10","min":6,"art":"⭐💗","body":"Nach einem Streit liegt Sorayas Papierstern zerrissen auf dem Tisch. Soraya findet den Mut für den ersten Schritt. Gemeinsam entschuldigen sich die Geschwister und kleben den Stern wieder zusammen."},{"id":"schuhe","title":"Die leise gute Tat","value":"Gute Absicht","age":"4–8","min":4,"art":"👟🌿","body":"Nura stellt im Flur alle Schuhe ordentlich hin, ohne jemandem davon zu erzählen. Niemand klatscht. Trotzdem fühlt sich die gute Tat richtig an."},{"id":"apfel","title":"Der geteilte Apfel","value":"Großzügigkeit","age":"4–8","min":4,"art":"🍎🤲","body":"Omar merkt, dass sein Freund sein Frühstück vergessen hat. Er teilt seinen Apfel. Aus zwei Hälften wird ein Moment echter Freundschaft."},{"id":"tasse","title":"Das ehrliche Herz","value":"Wahrhaftigkeit","age":"5–9","min":5,"art":"☕🌼","body":"Sara stößt aus Versehen eine Tasse um. Erst möchte sie schweigen, dann erzählt sie ehrlich, was passiert ist. Gemeinsam wird alles wieder sauber."},{"id":"garten","title":"Der Noor-Garten","value":"Gute Gewohnheiten","age":"5–10","min":6,"art":"🌺🪴","body":"Jeden Tag pflanzt Ilyas symbolisch eine Blüte für eine gute Tat: helfen, teilen, freundlich sprechen. Bald ist sein Noor-Garten voller kleiner Erinnerungen an das Gute."},{"id":"bruecke","title":"Die Brücke aus guten Worten","value":"Freundlichkeit","age":"5–10","min":6,"art":"🌉💬","body":"Zwei Kinder streiten beim Spielen. Ein freundliches Wort macht den Anfang, ein zweites baut die Brücke. Am Ende spielen beide wieder zusammen."},{"id":"rucksack","title":"Der leichte Rucksack","value":"Vergebung","age":"6–10","min":6,"art":"🎒🕊️","body":"Mina stellt sich vor, Ärger wäre ein schwerer Stein im Rucksack. Als sie verzeiht, fühlt sich der Rucksack leichter an. Sie lernt: Loslassen kann Mut brauchen."},{"id":"wasser","title":"Ein Becher Wasser","value":"Hilfsbereitschaft","age":"4–8","min":4,"art":"💧🌷","body":"Amir sieht, dass sein Großvater durstig ist. Er bringt ihm einen Becher Wasser, noch bevor jemand darum bittet. Kleine Aufmerksamkeit kann sehr viel bedeuten."},{"id":"mond","title":"Der Mond am Fenster","value":"Ruhe","age":"4–8","min":5,"art":"🌙🛏️","body":"Vor dem Schlafen ist Lina noch aufgeregt. Sie schaut auf den Mond, atmet langsam und denkt an drei schöne Dinge des Tages. Ihr Herz wird ruhig."},{"id":"karte","title":"Die Karte für Oma","value":"Familie","age":"4–9","min":4,"art":"💌🌸","body":"Die Kinder basteln eine Karte für ihre Oma. Jede Blume steht für etwas, das sie an ihr lieben. Die Karte wird zu einem kleinen Familien-Schatz."},{"id":"spielplatz","title":"Ein Platz für alle","value":"Respekt","age":"5–10","min":5,"art":"🛝🤝","body":"Auf dem Spielplatz ist ein neues Kind sehr still. Mariam macht Platz und lädt es freundlich ein. Bald wird aus Unsicherheit gemeinsames Lachen."},{"id":"fehler","title":"Der schiefe Turm","value":"Mut zum Lernen","age":"5–9","min":5,"art":"🧱✨","body":"Yusuf baut einen Turm, der immer wieder umfällt. Statt aufzugeben, probiert er ruhig weiter. Am Ende steht nicht der höchste, sondern sein bester Turm."},{"id":"familie","title":"Das Licht im Wohnzimmer","value":"Familienliebe","age":"4–9","min":5,"art":"🏠💛","body":"Als der Strom kurz ausfällt, sitzt die Familie zusammen bei einer kleinen Lampe. Sie erzählen Geschichten und lachen. Die Kinder merken: Wärme kommt nicht nur aus einer Steckdose."}],SONGS=[{"title":"Kleine Herzen","theme":"Gute Taten","lyrics":"Kleine Herzen, helles Licht,\nfreundlich sein vergisst man nicht.\nSchritt für Schritt und Tag für Tag,\ngutes tun, so gut ich mag."},{"title":"Alhamdulillah-Tag","theme":"Dankbarkeit","lyrics":"Morgens Sonne, abends Stern,\nDanke sagen hab ich gern.\nFür ein Lachen, Brot und Spiel,\nAlhamdulillah – danke für so viel."},{"title":"Sabr-Song","theme":"Geduld","lyrics":"Langsam wächst der kleine Baum,\nheute klein und morgen kaum.\nIch bleib ruhig, Schritt für Schritt,\nSabr nimmt mein Herzchen mit."},{"title":"Teilen macht hell","theme":"Großzügigkeit","lyrics":"Eine Hälfte für dich, eine für mich,\nteilen macht das Herz ganz licht.\nEine Hand hilft, eine Hand gibt,\nschön ist, wer das Gute liebt."},{"title":"Leise wird die Nacht","theme":"Schlaf","lyrics":"Leise wird die Nacht nun hier,\nRuhe wohnt jetzt nah bei mir.\nMit Bismillah schlaf ich ein,\nmorgen darf ein neuer Tag sein."},{"title":"Ein gutes Wort","theme":"Freundlichkeit","lyrics":"Ein gutes Wort, ein kleines Licht,\nein Lächeln, das die Sorge bricht.\nIch helfe dir, du hilfst mir,\nFreundlichkeit beginnt schon hier."},{"title":"Unser warmes Zuhause","theme":"Familie","lyrics":"Hand in Hand und Herz an Herz,\nwir teilen Freude, tragen Schmerz.\nMit Liebe wächst in unserm Haus,\nein warmes Licht von innen raus."},{"title":"Noor-Garten","theme":"Gute Gewohnheiten","lyrics":"Eine Blüte für ein gutes Wort,\neine für Hilfe hier und dort.\nJeden Tag ein kleines Licht,\nmein Noor-Garten vergisst es nicht."}],LEARN=[["Bismillah","Ein bewusster guter Start: Viele muslimische Familien sagen Bismillah vor alltäglichen guten Dingen.","🌙"],["Alhamdulillah","Ein Ausdruck von Dankbarkeit gegenüber Allah. Nenne heute drei Dinge, für die du dankbar bist.","🌼"],["Sabr","Geduldig beim Guten bleiben, auch wenn etwas Zeit braucht oder schwierig ist.","🌱"],["Sadaqah","Freiwillige Wohltätigkeit kann Geld, Hilfe, Zeit, Teilen oder ein freundliches Wort sein.","🤲"],["Salam","Ein freundlicher Friedensgruß, mit dem Menschen einander Respekt und Nähe zeigen.","🕊️"],["Adab","Gutes Benehmen: freundlich sprechen, zuhören, respektvoll sein und andere gut behandeln.","✨"]];
const SAFE='Darüber bin ich nicht sicher genug. Frag bitte gemeinsam mit einem Elternteil eine vertrauenswürdige Lehrkraft. Wir können gern über eine Geschichte, Freundlichkeit oder Dankbarkeit sprechen.';
const D={voice:true,mic:false,chant:true};let S={view:'home',story:null,song:0,q:'',ans:'Assalamu alaikum! Ich bin Amina. Sag „Hey Amina“ oder frag mich etwas über Geschichten, gute Werte und Lernen.',settings:load('aeiou.rc2.settings',D),prog:load('aeiou.rc2.progress',{done:[],fav:[]}),gate:false};const A=document.getElementById('app');function load(k,d){try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)||'{}'))}catch{return Object.assign({},d)}}function save(){localStorage.setItem('aeiou.rc2.settings',JSON.stringify(S.settings));localStorage.setItem('aeiou.rc2.progress',JSON.stringify(S.prog))}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function nav(){let n=[['home','🏠','Start'],['stories','📚','Stories'],['learn','✨','Lernen'],['songs','🎵','Singen'],['amina','🎙️','Amina'],['sleep','🌙','Schlaf'],['parents','🔒','Eltern']];return '<nav class="nav">'+n.map(x=>'<button data-nav="'+x[0]+'" class="'+(S.view===x[0]?'on':'')+'"><b>'+x[1]+'</b><span>'+x[2]+'</span></button>').join('')+'</nav>'}function hero(t,p,e){return '<section class="hero"><div class="row" style="justify-content:space-between"><div><small>AEIOU · AMINA RC2</small><h1>'+esc(t)+'</h1><p>'+esc(p)+'</p></div><div style="font-size:58px">'+e+'</div></div></section>'}function tile(s){return '<article class="card story" data-story="'+s.id+'"><div class="art">'+s.art+'</div><h3>'+esc(s.title)+'</h3><span class="pill">'+esc(s.value)+'</span><p class="muted">'+s.age+' · '+s.min+' Min.</p></article>'}function home(){let flowers=Math.min(30,S.prog.done.length);return '<main class="shell">'+hero('AEIOU','Islamische Kinderwelt mit Amina, Geschichten, Lernen, Singmodus und Schlafmodus.','🌙📖')+'<div class="grid"><div class="card"><h2>🌺 Noor-Garten</h2><div class="garden">'+Array.from({length:30},(_,i)=>i<flowers?'🌸':'·').join('')+'</div><p class="muted">Kein Streak-Druck. Jede abgeschlossene Geschichte pflanzt nur eine kleine Blüte.</p></div><div class="card"><h2>🛡️ Kindersicher</h2><p class="muted">Keine Werbung, kein Tracking, kein Standort, kein Kinderkonto, keine Speicherung von Roh-Audio. Mikrofon standardmäßig aus.</p><span class="pill safe">PIGA · Capability ≠ Permission</span></div></div><div class="grid">'+STORIES.slice(0,4).map(tile).join('')+'</div></main>'+nav()}function stories(){return '<main class="shell">'+hero('Noor Stories','18 vollständige, originale Geschichten über gute Werte.','📚✨')+'<div class="grid">'+STORIES.map(tile).join('')+'</div></main>'+nav()}function reader(){let s=S.story||STORIES[0],done=S.prog.done.includes(s.id);return '<main class="shell">'+hero(s.title,s.value,s.art)+'<div class="card"><p class="storybody">'+esc(s.body)+'</p><div class="row"><button data-speak="'+esc(s.body)+'">🔊 Vorlesen</button><button class="secondary" data-fav>♡ Favorit</button><button class="gold" data-finish>'+(done?'✓ Abgeschlossen':'🌸 Abschließen')+'</button></div></div><button class="secondary" data-nav="stories">← Zur Bibliothek</button></main>'+nav()}function learn(){return '<main class="shell">'+hero('Entdecken','Kleine Lernkarten für Begriffe und gute Gewohnheiten.','🌱✨')+'<div class="grid">'+LEARN.map(x=>'<div class="card"><div class="art">'+x[2]+'</div><h2>'+esc(x[0])+'</h2><p>'+esc(x[1])+'</p><button class="secondary" data-speak="'+esc(x[0]+'. '+x[1])+'">🔊 Anhören</button></div>').join('')+'</div></main>'+nav()}function songs(){let s=SONGS[S.song];return '<main class="shell">'+hero('Singmodus','8 originale Lernlieder. Lokale Melodie + Sprach-Chant; keine Behauptung einer neuronalen Gesangsstimme.','🎵🌸')+'<div class="card"><select id="song">'+SONGS.map((x,i)=>'<option value="'+i+'" '+(i===S.song?'selected':'')+'>'+esc(x.title)+' · '+esc(x.theme)+'</option>').join('')+'</select><div class="lyrics">'+esc(s.lyrics)+'</div><div class="row"><button class="gold" data-sing>▶ Melodie + Chant</button><button class="secondary" data-speak="'+esc(s.lyrics)+'">🔊 Nur Stimme</button></div></div></main>'+nav()}function localAnswer(q){q=q.toLowerCase();if(/adresse|schule|telefon|handy|foto|email|standort|passwort|treffen|url|link/.test(q))return 'Über private Daten sprechen wir hier nicht. Frag bitte deine Eltern. Wollen wir über eine Geschichte oder eine gute Tat reden?';if(/sabr|geduld/.test(q))return 'Sabr bedeutet, geduldig beim Guten zu bleiben, auch wenn etwas Zeit braucht. Stell dir einen Samen vor: Du gießt ihn weiter, obwohl die Blüte noch nicht da ist.';if(/dank|alhamdulillah/.test(q))return 'Dankbarkeit kann klein beginnen. Nenne drei Dinge, die heute schön waren – vielleicht ein Lachen, Wasser oder ein gemütlicher Moment.';if(/geschichte|erzähl/.test(q))return STORIES[Math.floor(Math.random()*STORIES.length)].body;if(/teilen|sadaqah/.test(q))return 'Teilen muss nicht groß sein. Zeit, Hilfe, ein freundliches Wort oder etwas von deinem Snack können schon wertvoll sein.';return SAFE}function amina(){return '<main class="shell">'+hero('Amina','Sichere lokale Begleiterin. „Hey Amina“ ist nur im Vordergrund aktiv; kein Always-on-Mikrofon.','🎙️🌙')+'<div class="card"><input id="q" maxlength="240" placeholder="Frag Amina …" value="'+esc(S.q)+'"><div class="row" style="margin-top:10px"><button data-ask>Antwort</button><button class="secondary" data-mic>🎙️ Hey Amina</button></div><div class="answer">'+esc(S.ans)+'</div><p class="muted">Cloud-AI bleibt im kanonischen App-Pfad Eltern-authentifiziert. Dieser öffentliche Live-Fallback nutzt absichtlich den lokalen sicheren Modus.</p></div></main>'+nav()}function sleep(){return '<main class="shell">'+hero('Schlafmodus','Ruhige Abendbegleitung ohne Druck und ohne Hintergrundaktivität.','🌙🛏️')+'<div class="card"><h2>Leise wird die Nacht</h2><p class="storybody">Leg das Gerät bequem hin. Atme langsam ein und aus. Denk an drei schöne Dinge von heute. Mit Bismillah darf der Tag nun ruhig enden.</p><div class="row"><button data-speak="Leg das Gerät bequem hin. Atme langsam ein und aus. Denk an drei schöne Dinge von heute. Mit Bismillah darf der Tag nun ruhig enden.">🔊 Ruhig vorlesen</button><button class="secondary" data-speak="Leise wird die Nacht nun hier. Ruhe wohnt jetzt nah bei mir. Mit Bismillah schlaf ich ein. Morgen darf ein neuer Tag sein.">🎵 Schlaflied</button></div></div></main>'+nav()}function parents(){if(!S.gate)return '<main class="shell">'+hero('Elternbereich','Kurze Erwachsenen-Schranke.','🔒')+'<div class="card"><p>Bitte lösen: <b>7 + 5 = ?</b></p><input id="gate" inputmode="numeric"><button style="margin-top:9px" data-unlock>Öffnen</button></div></main>'+nav();return '<main class="shell">'+hero('Elternbereich','Freigaben und Glassbox-Status.','🔒🌿')+'<div class="card">'+[['voice','Vorlesen'],['mic','Mikrofon · Standard aus'],['chant','Stimme im Singmodus']].map(x=>'<div class="setting"><b>'+x[1]+'</b><button class="secondary" data-toggle="'+x[0]+'">'+(S.settings[x[0]]?'AN':'AUS')+'</button></div>').join('')+'</div><div class="card"><h2>Glassbox</h2><p class="muted">Keine Werbung · kein Tracking · kein Standort · kein Kinderkonto · keine Roh-Audio-Speicherung. UNKNOWN wird nicht stillschweigend zu Erfolg. A7SEM Reverse nach jeder relevanten Entscheidung.</p><button class="secondary" data-reset>Lokalen Fortschritt löschen</button></div></main>'+nav()}function speak(t,r=.92){if(!S.settings.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=r;let vs=speechSynthesis.getVoices();let v=vs.find(x=>/^de/i.test(x.lang)&&/female|anna|katja|helena|petra|vicki|victoria|google.*deutsch/i.test((x.name||'')+' '+(x.voiceURI||'')))||vs.find(x=>/^de/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}function sing(){let AC=window.AudioContext||window.webkitAudioContext;if(!AC){speak(SONGS[S.song].lyrics,.82);return}let c=new AC(),g=c.createGain();g.gain.value=.08;g.connect(c.destination);let now=c.currentTime+.05,notes=[261.6,293.7,329.6,392,440,392,329.6,293.7];SONGS[S.song].lyrics.split(/s+/).forEach((w,i)=>{let o=c.createOscillator(),v=c.createGain();o.type='triangle';o.frequency.value=notes[i%notes.length];v.gain.setValueAtTime(.001,now);v.gain.exponentialRampToValueAtTime(.5,now+.02);v.gain.exponentialRampToValueAtTime(.001,now+.22);o.connect(v).connect(g);o.start(now);o.stop(now+.25);now+=.23});if(S.settings.chant)speak(SONGS[S.song].lyrics,.82);setTimeout(()=>c.close().catch(()=>{}),Math.max(500,(now-c.currentTime)*1000+200))}function render(){A.innerHTML=S.view==='home'?home():S.view==='stories'?stories():S.view==='reader'?reader():S.view==='learn'?learn():S.view==='songs'?songs():S.view==='amina'?amina():S.view==='sleep'?sleep():parents();bind()}function bind(){document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{S.view=e.dataset.nav;render()});document.querySelectorAll('[data-story]').forEach(e=>e.onclick=()=>{S.story=STORIES.find(x=>x.id===e.dataset.story)||STORIES[0];S.view='reader';render()});document.querySelectorAll('[data-speak]').forEach(e=>e.onclick=()=>speak(e.dataset.speak));let x=document.querySelector('[data-finish]');if(x)x.onclick=()=>{let id=S.story.id;if(!S.prog.done.includes(id))S.prog.done.push(id);save();S.view='home';render()};x=document.querySelector('[data-fav]');if(x)x.onclick=()=>{let id=S.story.id;S.prog.fav=S.prog.fav.includes(id)?S.prog.fav.filter(y=>y!==id):[...S.prog.fav,id];save();render()};x=document.getElementById('song');if(x)x.onchange=()=>{S.song=Number(x.value);render()};x=document.querySelector('[data-sing]');if(x)x.onclick=sing;x=document.querySelector('[data-ask]');if(x)x.onclick=()=>{S.q=(document.getElementById('q').value||'').trim();S.ans=S.q?localAnswer(S.q):S.ans;speak(S.ans);render()};x=document.querySelector('[data-mic]');if(x)x.onclick=()=>{if(!S.settings.mic){alert('Mikrofon ist im Elternbereich ausgeschaltet.');return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Spracherkennung wird hier nicht unterstützt. Bitte tippen.');return}let r=new R();r.lang='de-DE';r.interimResults=false;r.onresult=e=>{S.q=e.results[0][0].transcript;S.ans=localAnswer(S.q);speak(S.ans);render()};r.onerror=()=>alert('Mikrofon nicht verfügbar. Bitte tippen.');r.start()};x=document.querySelector('[data-unlock]');if(x)x.onclick=()=>{if(Number(document.getElementById('gate').value)===12){S.gate=true;render()}else alert('Bitte noch einmal versuchen.')};document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{S.settings[e.dataset.toggle]=!S.settings[e.dataset.toggle];save();render()});x=document.querySelector('[data-reset]');if(x)x.onclick=()=>{if(confirm('Lokalen Fortschritt wirklich löschen?')){S.prog={done:[],fav:[]};save();render()}}}render();if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
