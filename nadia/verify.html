<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a8667d"><title>Nadia App Prüfung</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf7;color:#352d31;font-family:system-ui,-apple-system,sans-serif}.c{width:min(88vw,420px);padding:26px;background:#fff;border:1px solid #eadde2;border-radius:28px;box-shadow:0 18px 50px #5335411f}.logo{width:68px;height:68px;border-radius:24px;background:#f7e3ea;display:grid;place-items:center;margin:auto;font:700 40px Georgia;color:#765361}h1{text-align:center;font:700 27px Georgia;margin:14px 0 6px}p{color:#806f77;text-align:center}.r{margin-top:14px;display:grid;gap:8px}.i{padding:10px 12px;border-radius:14px;background:#f8f2f4}.ok{background:#edf5ee;color:#4f7056}.bad{background:#f8e9eb;color:#8a4551}</style></head><body><main class="c"><div class="logo">N</div><h1>Nadia App Prüfung</h1><p id="status">Browser startet…</p><div id="results" class="r"></div></main><script>const B='https://qjvopzschqukitvudgfz.supabase.co/functions/v1/nadia-render-e2e?beacon=';function beacon(x){fetch(B+encodeURIComponent('GH_VERIFY_'+x+'_'+Date.now()),{mode:'no-cors',cache:'no-store'}).catch(()=>{})}async function run(){beacon('JS_RUNNING');const files=['./index.html','./app.js','./styles.css','./manifest.webmanifest','./sw.js'];let all=true;for(const f of files){try{const r=await fetch(f+'?proof='+Date.now(),{cache:'no-store'});const good=r.ok;all=all&&good;results.insertAdjacentHTML('beforeend','<div class="i '+(good?'ok':'bad')+'">'+(good?'✓ ':'✕ ')+f+' · HTTP '+r.status+'</div>')}catch(e){all=false;results.insertAdjacentHTML('beforeend','<div class="i bad">✕ '+f+'</div>')}}if(all){status.textContent='✓ Browser + alle App-Dateien bestätigt';beacon('ASSETS_PASS');setTimeout(()=>location.replace('./index.html?verified='+Date.now()),1800)}else{status.textContent='App-Dateien nicht vollständig';beacon('ASSETS_FAIL')}}run();</script></body></html>
