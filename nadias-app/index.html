<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Nadias App</title>
<style>
:root{--bg:#f7f3ef;--paper:#fffdfb;--ink:#302a30;--muted:#7d737b;--line:#eadfe2;--rose:#b96f82;--rose2:#f2dce3;--lilac:#a491b7;--lilac2:#ece5f2;--sage:#809b87;--sage2:#e4eee7;--sand:#d6b98f;--sand2:#f4eadb;--shadow:0 18px 50px rgba(83,58,70,.10)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0%,rgba(242,220,227,.75),transparent 30%),radial-gradient(circle at 100% 15%,rgba(236,229,242,.7),transparent 32%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:820px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(118px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:30;padding:8px 0 10px;background:linear-gradient(180deg,rgba(247,243,239,.98) 75%,rgba(247,243,239,0))}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-left{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:17px;background:linear-gradient(145deg,#f7dce5,#e8e1f0);display:grid;place-items:center;box-shadow:0 10px 24px rgba(126,88,103,.14);font:700 24px Georgia;color:#8f5365}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font:600 24px/1.1 Georgia,serif}h2{font:600 21px/1.2 Georgia,serif}h3{font-size:15px}.datepill{background:rgba(255,255,255,.72);border:1px solid rgba(234,223,226,.95);border-radius:999px;padding:9px 12px;font-size:12px;color:var(--muted);white-space:nowrap}.profile-rail{display:flex;gap:9px;overflow-x:auto;padding:10px 1px 4px;scrollbar-width:none}.profile-rail::-webkit-scrollbar{display:none}.person-tab{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:18px;padding:8px 11px 8px 8px;display:flex;align-items:center;gap:8px;color:var(--ink);min-height:48px}.person-tab.on{background:var(--paper);border-color:#d9c3ca;box-shadow:0 8px 22px rgba(91,62,75,.10)}.avatar{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--rose2);color:#8c5263}.person-tab[data-tone="sage"] .avatar{background:var(--sage2);color:#56705d}.person-tab[data-tone="lilac"] .avatar{background:var(--lilac2);color:#6b5a79}.person-tab[data-tone="sand"] .avatar{background:var(--sand2);color:#806a49}.person-tab small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.screen{display:none}.screen.on{display:block}.hero{margin:10px 0 14px;background:linear-gradient(135deg,rgba(255,253,251,.96),rgba(246,229,235,.92));border:1px solid rgba(232,209,217,.9);border-radius:28px;padding:20px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"✿";position:absolute;right:-3px;top:-18px;font-size:90px;color:rgba(185,111,130,.10);transform:rotate(14deg)}.hero p{color:var(--muted);margin-top:6px;max-width:520px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:rgba(255,255,255,.76);border:1px solid rgba(234,223,226,.85);border-radius:18px;padding:12px}.stat b{display:block;font-size:23px;color:var(--rose);margin-bottom:2px}.stat span{font-size:11px;color:var(--muted)}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:18px 2px 9px}.section-title p{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:rgba(255,253,251,.92);border:1px solid var(--line);border-radius:23px;padding:15px;box-shadow:0 10px 28px rgba(78,55,65,.06)}.card.full{grid-column:1/-1}.card.soft-rose{background:linear-gradient(145deg,#fffdfb,#f8e9ee)}.card.soft-sage{background:linear-gradient(145deg,#fffdfb,#eaf2ec)}.card.soft-lilac{background:linear-gradient(145deg,#fffdfb,#f0eaf4)}.card.soft-sand{background:linear-gradient(145deg,#fffdfb,#f6eddf)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.iconbox{width:38px;height:38px;border-radius:14px;background:var(--rose2);display:grid;place-items:center;font-size:19px}.muted{font-size:12px;color:var(--muted)}.list{display:grid;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.78);border:1px solid rgba(234,223,226,.8);border-radius:16px;padding:10px 11px}.row-main{min-width:0}.row b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .meta{font-size:11px;color:var(--muted);margin-top:3px}.row.done{opacity:.55}.row.done b{text-decoration:line-through}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#f2e8eb;color:#7c5562;font-size:10px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick{border:0;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:17px;padding:11px 6px;color:var(--ink);min-height:74px}.quick span{display:block;font-size:22px;margin-bottom:5px}.quick small{font-size:11px}.primary,.secondary,.ghost,.danger{border:0;border-radius:14px;min-height:42px;padding:10px 13px;font-weight:600}.primary{background:var(--rose);color:white}.secondary{background:#efe8f3;color:#665574}.ghost{background:rgba(255,255,255,.7);color:#725663;border:1px solid var(--line)}.danger{background:#fff0f0;color:#9b5757;border:1px solid #f2d4d4}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.segment{display:flex;gap:5px;background:rgba(255,255,255,.66);padding:5px;border:1px solid var(--line);border-radius:16px;overflow-x:auto}.segment button{border:0;background:transparent;padding:9px 12px;border-radius:12px;white-space:nowrap;color:var(--muted)}.segment button.on{background:var(--paper);box-shadow:0 4px 12px rgba(86,64,74,.08);color:var(--ink);font-weight:600}label.field{display:grid;gap:5px;font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#fffdfb;border-radius:14px;padding:12px;color:var(--ink);outline:none}textarea{min-height:90px;resize:vertical}dialog{border:0;border-radius:26px;width:min(94vw,560px);padding:0;background:var(--paper);box-shadow:0 24px 80px rgba(48,32,40,.25)}dialog::backdrop{background:rgba(43,32,38,.32);backdrop-filter:blur(4px)}.modal{padding:18px}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.close{border:0;background:#f4edef;width:38px;height:38px;border-radius:13px;font-size:18px}.form{display:grid;gap:10px}.check{display:flex;gap:9px;align-items:center}.check input{width:18px;height:18px}.empty{padding:18px;border:1px dashed #dbcbd0;border-radius:17px;text-align:center;color:var(--muted);font-size:12px}.daygrid{display:grid;gap:7px}.meal-row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center}.bottomnav{position:fixed;z-index:50;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:796px;margin:0 auto;background:rgba(255,253,251,.94);border:1px solid rgba(224,210,214,.95);box-shadow:0 16px 46px rgba(64,43,53,.18);backdrop-filter:blur(18px);border-radius:24px;padding:7px}.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;background:transparent;color:var(--muted);border-radius:17px;min-height:58px;padding:6px 2px;font-size:10px}.navbtn span{display:block;font-size:21px;line-height:1.1;margin-bottom:3px}.navbtn.on{background:#f4e6ea;color:#8b5263;font-weight:700}.fab{position:fixed;z-index:45;right:18px;bottom:calc(91px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:19px;background:linear-gradient(145deg,#c4778c,#a96075);color:white;font-size:26px;box-shadow:0 13px 28px rgba(143,83,101,.30)}.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));background:#352c31;color:white;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:560px){.app{padding-left:11px;padding-right:11px}.datepill{display:none}.cards{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:17px}.stats{gap:6px}.stat{padding:10px}}@media(min-width:900px){.bottomnav{left:50%;right:auto;transform:translateX(-50%);width:796px}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand"><div class="brand-left"><div class="mark">N</div><div><div class="eyebrow">Family · Home · Life</div><h1>Nadias App</h1></div></div><div id="datePill" class="datepill"></div></div><div id="profileRail" class="profile-rail" aria-label="Familienprofile"></div></header><main><section id="today" class="screen on"></section><section id="family" class="screen"></section><section id="plan" class="screen"></section><section id="everyday" class="screen"></section><section id="more" class="screen"></section></main></div>
<button id="fab" class="fab" aria-label="Neu hinzufügen">＋</button><div id="toast" class="toast"></div>
<nav class="bottomnav" aria-label="Hauptnavigation"><div class="navgrid"><button class="navbtn on" data-screen="today"><span>⌂</span>Heute</button><button class="navbtn" data-screen="family"><span>♡</span>Familie</button><button class="navbtn" data-screen="plan"><span>◫</span>Planen</button><button class="navbtn" data-screen="everyday"><span>✦</span>Alltag</button><button class="navbtn" data-screen="more"><span>•••</span>Mehr</button></div></nav>
<dialog id="modal"><div class="modal"><div class="modal-head"><div><div class="eyebrow">Nadias App</div><h2 id="modalTitle">Neu</h2></div><button class="close" id="closeModal">×</button></div><form id="modalForm" class="form"></form></div></dialog>
<script>
(()=>{const K3='nadia-family-v3',K2='nadia-v2';const people=[{id:'nadia',name:'Nadia',role:'Ich',tone:'rose',initial:'N'},{id:'jakob',name:'Jakob',role:'Kind',tone:'sage',initial:'J'},{id:'noah',name:'Noah',role:'Kind',tone:'lilac',initial:'N'},{id:'soraya',name:'Soraya',role:'Kind',tone:'sand',initial:'S'},{id:'sara',name:'Sara',role:'Kind',tone:'rose',initial:'S'},{id:'nia',name:'Nia',role:'Kind',tone:'sage',initial:'N'}];const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];const base=()=>({version:3,activePerson:'nadia',events:[],tasks:[],shopping:[],notes:[],school:[],routines:[],meals:Object.fromEntries(days.map(d=>[d,''])),settings:{name:'Nadia'}});const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'short'}):'';function load(){try{const v3=JSON.parse(localStorage.getItem(K3)||'null');if(v3){return{...base(),...v3,meals:{...base().meals,...(v3.meals||{})}}}const old=JSON.parse(localStorage.getItem(K2)||'null');if(old){const n=base();n.events=(old.events||[]).map(x=>({...x,personId:x.personId||'family'}));n.tasks=(old.tasks||[]).map(x=>({...x,personId:x.personId||'family',category:x.category||'Alltag'}));n.shopping=old.shopping||[];n.notes=(old.notes||[]).map(x=>({...x,personId:x.personId||'nadia'}));n.routines=old.routines||[];if(old.profile?.name)n.settings.name=old.profile.name;localStorage.setItem(K3,JSON.stringify(n));return n}}catch(e){}return base()}let D=load(),screen='today',planView='calendar',everyView='shopping';const $=id=>document.getElementById(id);const rail=$('profileRail'),datePill=$('datePill'),modal=$('modal'),form=$('modalForm'),modalTitle=$('modalTitle'),toast=$('toast');function save(msg){localStorage.setItem(K3,JSON.stringify(D));render();if(msg)notify(msg)}function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}function person(id){return people.find(p=>p.id===id)||people[0]}function targetName(id){return id==='family'?'Familie':person(id).name}function todayISO(){return new Date().toISOString().slice(0,10)}function renderRail(){rail.innerHTML=people.map(p=>`<button class="person-tab ${D.activePerson===p.id?'on':''}" data-person="${p.id}" data-tone="${p.tone}"><span class="avatar">${p.initial}</span><span>${p.name}<small>${p.role}</small></span></button>`).join('');rail.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{D.activePerson=b.dataset.person;save();screen='family';render()})}function counts(){const t=todayISO();return{ev:D.events.filter(x=>x.date===t).length,task:D.tasks.filter(x=>!x.done).length,shop:D.shopping.filter(x=>!x.done).length}}function nextEvents(filterId=null,limit=5){return D.events.filter(x=>(!filterId||x.personId===filterId||x.personId==='family')&&(!x.date||x.date>=todayISO())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,limit)}function eventList(items){if(!items.length)return`<div class="empty">Noch keine Termine eingetragen.</div>`;return`<div class="list">${items.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.title)}</b><div class="meta">${fmt(x.date)} ${esc(x.time||'')} · ${esc(targetName(x.personId||'family'))}</div></div><button class="ghost" data-del-event="${x.id}">×</button></div>`).join('')}</div>`}function taskList(items){if(!items.length)return`<div class="empty">Keine offenen Aufgaben.</div>`;return`<div class="list">${items.map(x=>`<div class="row ${x.done?'done':''}"><label class="check row-main"><input type="checkbox" data-task-check="${x.id}" ${x.done?'checked':''}><span><b>${esc(x.title)}</b><span class="meta">${esc(x.category||'Alltag')} · ${esc(targetName(x.personId||'family'))}${x.due?' · '+fmt(x.due):''}</span></span></label><button class="ghost" data-del-task="${x.id}">×</button></div>`).join('')}</div>`}function notesList(items){if(!items.length)return`<div class="empty">Noch keine Notizen.</div>`;return`<div class="list">${items.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.title)}</b><div class="meta">${esc(x.text||'')}</div></div><button class="ghost" data-del-note="${x.id}">×</button></div>`).join('')}</div>`}function schoolList(items){if(!items.length)return`<div class="empty">Hier können Schule, Kita, Ausflüge oder wichtige Infos gesammelt werden.</div>`;return`<div class="list">${items.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.title)}</b><div class="meta">${esc(x.text||'')}${x.date?' · '+fmt(x.date):''}</div></div><button class="ghost" data-del-school="${x.id}">×</button></div>`).join('')}</div>`}function renderToday(){const c=counts(),n=D.settings.name||'Nadia',h=new Date().getHours(),g=h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend',evs=nextEvents(null,5),tasks=D.tasks.filter(x=>!x.done).slice(0,5);$('today').innerHTML=`<div class="hero"><div class="eyebrow">Alles an einem Ort</div><h2>${g}, ${esc(n)}</h2><p>Ein ruhiger Überblick über Familie, Termine und den Alltag – ohne Suchen und ohne überladene Menüs.</p><div class="stats"><div class="stat"><b>${c.ev}</b><span>Termine heute</span></div><div class="stat"><b>${c.task}</b><span>offene Aufgaben</span></div><div class="stat"><b>${c.shop}</b><span>auf der Liste</span></div></div></div><div class="section-title"><div><h2>Schnell erledigt</h2><p>Die häufigsten Dinge direkt erreichbar</p></div></div><div class="quick-grid"><button class="quick" data-add="event"><span>＋</span><small>Termin</small></button><button class="quick" data-add="task"><span>✓</span><small>Aufgabe</small></button><button class="quick" data-add="shopping"><span>👜</span><small>Einkauf</small></button><button class="quick" data-add="note"><span>✎</span><small>Notiz</small></button></div><div class="cards" style="margin-top:12px"><div class="card full"><div class="card-head"><div><div class="eyebrow">Als Nächstes</div><h3>Termine</h3></div><button class="ghost" data-go="plan">Alle</button></div>${eventList(evs)}</div><div class="card full"><div class="card-head"><div><div class="eyebrow">Im Blick</div><h3>Aufgaben</h3></div><button class="ghost" data-go="plan">Alle</button></div>${taskList(tasks)}</div></div>`;bindCommon($('today'))}function renderFamily(){const p=person(D.activePerson),child=p.id!=='nadia',pe=nextEvents(p.id,4),pt=D.tasks.filter(x=>!x.done&&(x.personId===p.id||x.personId==='family')).slice(0,5),pn=D.notes.filter(x=>x.personId===p.id).slice(0,4),ps=D.school.filter(x=>x.personId===p.id).slice(0,4);$('family').innerHTML=`<div class="hero"><div class="eyebrow">${child?'Kinderprofil':'Mein Bereich'}</div><h2>${esc(p.name)}</h2><p>${child?'Termine, Aufgaben, Schule/Kita und Notizen in einem persönlichen Bereich.':'Deine persönlichen Termine, Aufgaben und Notizen – getrennt vom Familienüberblick.'}</p><div class="inline" style="margin-top:14px"><button class="primary" data-add="event">＋ Termin</button><button class="secondary" data-add="task">＋ Aufgabe</button><button class="ghost" data-add="note">＋ Notiz</button></div></div><div class="cards"><div class="card soft-rose"><div class="card-head"><div><div class="iconbox">◫</div></div><button class="ghost" data-add="event">＋</button></div><h3>Termine</h3><div style="height:8px"></div>${eventList(pe)}</div><div class="card soft-sage"><div class="card-head"><div><div class="iconbox">✓</div></div><button class="ghost" data-add="task">＋</button></div><h3>Aufgaben</h3><div style="height:8px"></div>${taskList(pt)}</div><div class="card soft-lilac"><div class="card-head"><div><div class="iconbox">✎</div></div><button class="ghost" data-add="note">＋</button></div><h3>Notizen</h3><div style="height:8px"></div>${notesList(pn)}</div><div class="card soft-sand"><div class="card-head"><div><div class="iconbox">${child?'🎒':'✦'}</div></div><button class="ghost" data-add="${child?'school':'task'}">＋</button></div><h3>${child?'Schule & Kita':'Persönlich'}</h3><div style="height:8px"></div>${child?schoolList(ps):taskList(D.tasks.filter(x=>!x.done&&x.personId===p.id).slice(0,4))}</div></div>`;bindCommon($('family'))}function renderPlan(){$('plan').innerHTML=`<div class="section-title"><div><div class="eyebrow">Familienplanung</div><h2>Planen</h2></div></div><div class="segment"><button data-plan="calendar" class="${planView==='calendar'?'on':''}">Kalender</button><button data-plan="tasks" class="${planView==='tasks'?'on':''}">Aufgaben</button></div><div style="height:10px"></div>${planView==='calendar'?`<div class="card"><div class="card-head"><div><h3>Alle Termine</h3><div class="muted">Familie und persönliche Termine zusammen</div></div><button class="primary" data-add="event">＋ Termin</button></div>${eventList(nextEvents(null,50))}</div>`:`<div class="card"><div class="card-head"><div><h3>Alle Aufgaben</h3><div class="muted">Nach Person und Bereich organisiert</div></div><button class="primary" data-add="task">＋ Aufgabe</button></div>${taskList(D.tasks)}</div>`}`;$('plan').querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{planView=b.dataset.plan;renderPlan()});bindCommon($('plan'))}function shoppingPanel(){const list=D.shopping;return`<div class="card"><div class="card-head"><div><h3>Einkaufsliste</h3><div class="muted">${list.filter(x=>!x.done).length} offen</div></div><div class="inline"><button class="ghost" id="shareShopping">Teilen</button><button class="primary" data-add="shopping">＋ Artikel</button></div></div>${list.length?`<div class="list">${list.map(x=>`<div class="row ${x.done?'done':''}"><label class="check row-main"><input type="checkbox" data-shop-check="${x.id}" ${x.done?'checked':''}><span><b>${esc(x.name)}</b><span class="meta">${esc(x.qty||'')}</span></span></label><button class="ghost" data-del-shop="${x.id}">×</button></div>`).join('')}</div>`:`<div class="empty">Die Einkaufsliste ist leer.</div>`}</div>`}function mealPanel(){return`<div class="card"><div class="card-head"><div><h3>Wochenessen</h3><div class="muted">Einfach eintragen – wird automatisch gespeichert</div></div></div><div class="daygrid">${days.map(d=>`<div class="meal-row"><b>${d.slice(0,2)}</b><input data-meal="${d}" value="${esc(D.meals[d]||'')}" placeholder="z. B. Pasta, Suppe …"></div>`).join('')}</div></div>`}function routinePanel(){return`<div class="card"><div class="card-head"><div><h3>Routinen</h3><div class="muted">Wiederkehrende Dinge ohne extra Menü</div></div><button class="primary" data-add="routine">＋ Routine</button></div>${D.routines.length?`<div class="list">${D.routines.map(x=>`<div class="row ${x.last===todayISO()?'done':''}"><div class="row-main"><b>${esc(x.title)}</b><div class="meta">${x.last===todayISO()?'Heute erledigt':'Heute offen'}</div></div><div class="inline"><button class="secondary" data-routine-done="${x.id}">Erledigt</button><button class="ghost" data-del-routine="${x.id}">×</button></div></div>`).join('')}</div>`:`<div class="empty">Noch keine Routinen.</div>`}</div>`}function renderEveryday(){$('everyday').innerHTML=`<div class="section-title"><div><div class="eyebrow">Zu Hause</div><h2>Alltag</h2></div></div><div class="segment"><button data-every="shopping" class="${everyView==='shopping'?'on':''}">Einkauf</button><button data-every="meals" class="${everyView==='meals'?'on':''}">Essen</button><button data-every="routines" class="${everyView==='routines'?'on':''}">Routinen</button></div><div style="height:10px"></div>${everyView==='shopping'?shoppingPanel():everyView==='meals'?mealPanel():routinePanel()}`;$('everyday').querySelectorAll('[data-every]').forEach(b=>b.onclick=()=>{everyView=b.dataset.every;renderEveryday()});bindCommon($('everyday'))}function renderMore(){$('more').innerHTML=`<div class="section-title"><div><div class="eyebrow">Einstellungen</div><h2>Mehr</h2></div></div><div class="cards"><div class="card soft-rose"><h3>Profil</h3><div style="height:9px"></div><label class="field">Dein Name<input id="profileName" value="${esc(D.settings.name||'Nadia')}"></label><div style="height:8px"></div><button class="primary" id="saveProfile">Speichern</button></div><div class="card soft-sage"><h3>Datensicherung</h3><p class="muted" style="margin:6px 0 10px">Die Daten bleiben auf dem iPhone. Backup als Datei exportieren oder wieder einlesen.</p><div class="inline"><button class="secondary" id="exportData">Backup</button><label class="ghost" style="display:inline-flex;align-items:center">Importieren<input id="importData" type="file" accept="application/json" hidden></label></div></div><div class="card full"><h3>Über Nadias App</h3><p class="muted" style="margin-top:6px">Familienplaner für Nadia, Jakob, Noah, Soraya, Sara und Nia. Die wichtigsten Bereiche sind über die Profile oben und die fünf Hauptbereiche unten erreichbar.</p></div><div class="card full"><h3>Zurücksetzen</h3><p class="muted" style="margin:6px 0 10px">Löscht nur die lokal gespeicherten Daten dieser App.</p><button class="danger" id="resetData">Lokale Daten löschen</button></div></div>`;$('saveProfile').onclick=()=>{D.settings.name=$('profileName').value.trim()||'Nadia';save('Gespeichert')};$('exportData').onclick=exportData;$('importData').onchange=e=>importData(e.target.files[0]);$('resetData').onclick=()=>{if(confirm('Wirklich alle lokalen Daten löschen?')){D=base();save('Zurückgesetzt')}}}function bindCommon(root){root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openAdd(b.dataset.add));root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{D.events=D.events.filter(x=>x.id!==b.dataset.delEvent);save('Termin gelöscht')});root.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{D.tasks=D.tasks.filter(x=>x.id!==b.dataset.delTask);save('Aufgabe gelöscht')});root.querySelectorAll('[data-task-check]').forEach(b=>b.onchange=()=>{const x=D.tasks.find(x=>x.id===b.dataset.taskCheck);if(x){x.done=b.checked;save()}});root.querySelectorAll('[data-del-note]').forEach(b=>b.onclick=()=>{D.notes=D.notes.filter(x=>x.id!==b.dataset.delNote);save('Notiz gelöscht')});root.querySelectorAll('[data-del-school]').forEach(b=>b.onclick=()=>{D.school=D.school.filter(x=>x.id!==b.dataset.delSchool);save('Eintrag gelöscht')});root.querySelectorAll('[data-shop-check]').forEach(b=>b.onchange=()=>{const x=D.shopping.find(x=>x.id===b.dataset.shopCheck);if(x){x.done=b.checked;save()}});root.querySelectorAll('[data-del-shop]').forEach(b=>b.onclick=()=>{D.shopping=D.shopping.filter(x=>x.id!==b.dataset.delShop);save('Artikel gelöscht')});root.querySelectorAll('[data-routine-done]').forEach(b=>b.onclick=()=>{const x=D.routines.find(x=>x.id===b.dataset.routineDone);if(x){x.last=todayISO();save('Erledigt')}});root.querySelectorAll('[data-del-routine]').forEach(b=>b.onclick=()=>{D.routines=D.routines.filter(x=>x.id!==b.dataset.delRoutine);save('Routine gelöscht')});root.querySelectorAll('[data-meal]').forEach(i=>i.onchange=()=>{D.meals[i.dataset.meal]=i.value;localStorage.setItem(K3,JSON.stringify(D));notify('Gespeichert')});const sh=root.querySelector('#shareShopping');if(sh)sh.onclick=shareShopping}function options(selected=D.activePerson,includeFamily=true){return`${includeFamily?`<option value="family" ${selected==='family'?'selected':''}>Familie</option>`:''}${people.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${p.name}</option>`).join('')}`}function openAdd(type){const p=D.activePerson||'nadia';const specs={event:{title:'Termin hinzufügen',body:`<label class="field">Für wen?<select name="personId">${options(p,true)}</select></label><label class="field">Titel<input name="title" required placeholder="z. B. Zahnarzt, Training, Geburtstag"></label><div class="cards"><label class="field">Datum<input type="date" name="date" required></label><label class="field">Uhrzeit<input type="time" name="time"></label></div>`},task:{title:'Aufgabe hinzufügen',body:`<label class="field">Für wen?<select name="personId">${options(p,true)}</select></label><label class="field">Aufgabe<input name="title" required placeholder="Was ist zu erledigen?"></label><label class="field">Bereich<select name="category"><option>Alltag</option><option>Schule/Kita</option><option>Freizeit</option><option>Haushalt</option><option>Persönlich</option></select></label><label class="field">Fällig am<input type="date" name="due"></label>`},shopping:{title:'Zur Einkaufsliste',body:`<label class="field">Artikel<input name="name" required placeholder="z. B. Milch"></label><label class="field">Menge<input name="qty" placeholder="z. B. 2x"></label>`},note:{title:'Notiz hinzufügen',body:`<label class="field">Für wen?<select name="personId">${options(p,false)}</select></label><label class="field">Titel<input name="title" required placeholder="Titel"></label><label class="field">Notiz<textarea name="text" placeholder="Wichtige Info …"></textarea></label>`},school:{title:'Schule / Kita',body:`<label class="field">Für wen?<select name="personId">${options(p,false)}</select></label><label class="field">Thema<input name="title" required placeholder="z. B. Elternabend, Ausflug, Sportzeug"></label><label class="field">Datum<input type="date" name="date"></label><label class="field">Info<textarea name="text" placeholder="Details …"></textarea></label>`},routine:{title:'Routine hinzufügen',body:`<label class="field">Routine<input name="title" required placeholder="z. B. Schultaschen prüfen"></label>`}};const s=specs[type]||specs.task;modalTitle.textContent=s.title;form.innerHTML=s.body+`<button class="primary" type="submit">Speichern</button>`;form.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(form));o.id=uid();if(type==='event')D.events.push(o);if(type==='task'){o.done=false;D.tasks.push(o)}if(type==='shopping'){o.done=false;D.shopping.push(o)}if(type==='note')D.notes.push(o);if(type==='school')D.school.push(o);if(type==='routine'){o.last='';D.routines.push(o)}modal.close();save('Gespeichert')};modal.showModal()}function shareShopping(){const text='Einkaufsliste\n'+D.shopping.filter(x=>!x.done).map(x=>'• '+x.name+(x.qty?' ('+x.qty+')':'')).join('\n');if(navigator.share)navigator.share({title:'Einkaufsliste',text}).catch(()=>{});else location.href='mailto:?subject=Einkaufsliste&body='+encodeURIComponent(text)}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='nadias-app-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);D={...base(),...x,meals:{...base().meals,...(x.meals||{})}};save('Backup importiert')}catch(e){alert('Diese Backup-Datei konnte nicht gelesen werden.')}};r.readAsText(file)}function go(s){screen=s;render()}function render(){datePill.textContent=new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});renderRail();['today','family','plan','everyday','more'].forEach(id=>$(id).classList.toggle('on',id===screen));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.screen===screen));if(screen==='today')renderToday();if(screen==='family')renderFamily();if(screen==='plan')renderPlan();if(screen==='everyday')renderEveryday();if(screen==='more')renderMore()}document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.screen));$('fab').onclick=()=>openAdd(screen==='everyday'&&everyView==='shopping'?'shopping':screen==='family'?'task':'event');$('closeModal').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});render()})();
</script>
