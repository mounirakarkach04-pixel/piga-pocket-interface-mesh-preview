<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b56f7d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Nadias App</title><style>
:root{--bg:#fbf6ef;--c:#fffaf6dc;--t:#352b31;--m:#7f6f77;--r:#b56f7d;--l:#9b88b4;--s:#79957d;--ln:#5b414d20}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fffaf5,var(--bg));color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:720px;margin:auto;padding:18px 14px 95px}.top{display:flex;gap:12px;align-items:center}.logo{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f7d9df,#e7dfef);font:30px Georgia;color:#8d5966}.date{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--m)}h1,h2{font-family:Georgia,serif;margin:2px 0}.card{background:var(--c);border:1px solid var(--ln);border-radius:22px;padding:15px;margin:12px 0;box-shadow:0 12px 32px #5e424e12}.hero{background:linear-gradient(135deg,#f7d9dfbb,#e8dff0c9)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:12px;border-radius:16px;background:#ffffff99}.stat b{display:block;font-size:25px;color:var(--r)}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;border-radius:15px;background:#ffffff88;margin:7px 0}.muted{color:var(--m);font-size:12px}.btn,.chip{border:0;border-radius:14px;padding:10px 12px;min-height:42px}.btn{background:var(--r);color:white}.alt{background:#eee7f4;color:#5f4f6e}.ghost{background:transparent;color:var(--r);border:1px solid var(--ln)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f4efe8;border:1px solid var(--ln)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffaf6ee;border-top:1px solid var(--ln);backdrop-filter:blur(14px);padding:7px}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;border-radius:12px;padding:7px 2px;color:var(--m);font-size:11px}.nav button.on{background:#f2e4e7;color:#8b5361}.nav span{display:block;font-size:19px}.screen{display:none}.screen.on{display:block}.fab{position:fixed;right:17px;bottom:78px;width:52px;height:52px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:27px}dialog{border:0;border-radius:20px;width:min(94%,520px)}form{display:grid;gap:9px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:#fffdfa;font:inherit}.done{text-decoration:line-through;opacity:.55}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}}
</style></head><body><div class="app"><header class="top"><div class="logo">N</div><div><div class="date" id="date"></div><h1 id="hello">Nadias App</h1></div></header><main><section id="home" class="screen on"></section><section id="calendar" class="screen"></section><section id="tasks" class="screen"></section><section id="shopping" class="screen"></section><section id="more" class="screen"></section></main></div><button class="fab" id="fab">＋</button><nav class="nav"><div class="navin"><button data-s="home" class="on"><span>⌂</span>Heute</button><button data-s="calendar"><span>🗓</span>Kalender</button><button data-s="tasks"><span>✓</span>Aufgaben</button><button data-s="shopping"><span>🛒</span>Einkauf</button><button data-s="more"><span>✿</span>Mehr</button></div></nav><dialog id="dlg"><h2 id="dt">Neu</h2><form id="form"></form><button class="btn ghost" onclick="dlg.close()">Schließen</button></dialog><script src="app.js"></script></body></html>
