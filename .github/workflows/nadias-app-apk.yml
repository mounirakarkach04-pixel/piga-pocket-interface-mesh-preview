name: Build Nadias App APK

on:
  workflow_dispatch:
  push:
    branches: [nadias-app-public]
    paths:
      - 'nadias-app-android/.build-trigger'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Embed Nadias App V3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nadias-app-android/app/src/main/assets
          mkdir -p nadias-app-android/app/src/main/assets
          cp -R nadias-app/. nadias-app-android/app/src/main/assets/

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p nadias-app-android :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp nadias-app-android/app/build/outputs/apk/release/app-release.apk release/Nadias-App-V3.apk
          (cd release && sha256sum Nadias-App-V3.apk > SHA256SUMS.txt)
          test -s release/Nadias-App-V3.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nadias-App-V3-Android
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nadias-app-v3.0.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            release/Nadias-App-V3.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Nadias App 3.0.0" \
            --notes "Aktuelle Android-Version von Nadias App mit modernisiertem Family-Dashboard, eigenen Profilen für Nadia, Jakob, Noah, Soraya, Sara und Nia, Schule/Kita je Kinderprofil, Familienkalender, Aufgaben, Einkauf, Wochenessen, Routinen und verbesserter mobiler Navigation."
