name: Sync AEIOU RC2 into gh-pages

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeiou-gh-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Fetch and verify AEIOU RC2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aeiou
          AEIOU_BASE='https://qjvopzschqukitvudgfz.supabase.co/functions/v1/aeiou-kids-live'
          curl --fail --silent --show-error --location "$AEIOU_BASE/" -o aeiou/index.html
          curl --fail --silent --show-error --location "$AEIOU_BASE/manifest.webmanifest" -o aeiou/manifest.webmanifest
          curl --fail --silent --show-error --location "$AEIOU_BASE/sw.js" -o aeiou/sw.js
          curl --fail --silent --show-error --location "$AEIOU_BASE/health" -o aeiou/source-health.json

          grep -q '<html' aeiou/index.html
          grep -q 'AMINA RC2' aeiou/index.html
          grep -q 'Noor-Garten' aeiou/index.html
          grep -q 'Die Laterne, die zurückkam' aeiou/index.html
          grep -q 'aeiou.rc2.settings' aeiou/index.html
          grep -q '"status":"PASS"' aeiou/source-health.json
          grep -q '"stories":18' aeiou/source-health.json
          grep -q '"songs":8' aeiou/source-health.json
          touch .nojekyll
      - name: Commit RC2 to published branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'piga-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add aeiou .nojekyll
          if git diff --cached --quiet; then
            echo 'AEIOU RC2 already current on gh-pages.'
            exit 0
          fi
          git commit -m 'feat(aeiou): publish rendered Amina RC2'
          git push origin HEAD:gh-pages
