name: Deploy PIGA Interface Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nadia/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: nadia-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare proven static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/nadia _site/aeiou
          cp -R nadia/. _site/nadia/

          AEIOU_BASE='https://qjvopzschqukitvudgfz.supabase.co/functions/v1/aeiou-kids-live'
          curl --fail --silent --show-error --location "$AEIOU_BASE/" -o _site/aeiou/index.html
          curl --fail --silent --show-error --location "$AEIOU_BASE/manifest.webmanifest" -o _site/aeiou/manifest.webmanifest
          curl --fail --silent --show-error --location "$AEIOU_BASE/sw.js" -o _site/aeiou/sw.js
          curl --fail --silent --show-error --location "$AEIOU_BASE/health" -o _site/aeiou/source-health.json

          grep -q '<html' _site/aeiou/index.html
          grep -q 'AEIOU' _site/aeiou/index.html
          grep -q 'AMINA RC2' _site/aeiou/index.html
          grep -q 'Noor-Garten' _site/aeiou/index.html
          grep -q 'Die Laterne, die zurückkam' _site/aeiou/index.html
          grep -q 'aeiou.rc2.settings' _site/aeiou/index.html
          grep -q '"status":"PASS"' _site/aeiou/source-health.json
          grep -q '"stories":18' _site/aeiou/source-health.json
          grep -q '"songs":8' _site/aeiou/source-health.json
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
